<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ast.pp.ua — Mail</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/favicon.svg" alt="" class="brand-icon" />
      <span>ast.pp.ua</span>
      <span id="userPill" class="user-pill hidden">
        <img id="userAvatar" alt="" class="avatar-sm" />
        <span id="me" class="address"></span>
      </span>
    </div>
    <nav id="navBar" class="nav hidden">
      <a href="#/inbox" data-route="inbox">Inbox <span id="inboxCount" class="badge">0</span></a>
      <a href="#/sent" data-route="sent">Sent <span id="sentCount" class="badge">0</span></a>
      <a href="#/compose" data-route="compose">Compose</a>
      <a href="#/account" data-route="account">Account</a>
    </nav>
  </header>

  <!-- Authentication view -->
  <section id="authView" class="card">
    <h3>Sign in or Create Mailbox</h3>
    <input id="authUser" placeholder="Username (e.g. me)" autocomplete="username" />
    <div class="pw-wrap">
      <input id="authPass" type="password" placeholder="Password (min 4 chars)" autocomplete="current-password" />
      <button type="button" class="toggle-pw" data-target="authPass">Show</button>
    </div>
    <div class="row">
      <button id="btnLogin">Sign In</button>
      <button id="btnRegister" class="sec">Create @ast.pp.ua</button>
    </div>
    <div id="authErr" class="status"></div>
  </section>

  <!-- Dedicated pages -->
  <main id="appView" class="hidden">
    <section id="page-inbox" class="card page hidden">
      <h3>Inbox</h3>
      <div id="inboxList"></div>
    </section>

    <section id="page-sent" class="card page hidden">
      <h3>Sent</h3>
      <div id="sentList"></div>
    </section>

    <section id="page-compose" class="card page hidden">
      <h3>Compose Message</h3>
      <input id="to" placeholder="To (e.g. test or test@ast.pp.ua)" />
      <input id="subj" placeholder="Subject" />
      <textarea id="body" rows="6" placeholder="Message body..."></textarea>
      <button id="btnSend">Send (ASTP Binary)</button>
      <div id="sendStatus" class="status"></div>
    </section>

    <section id="page-account" class="card page hidden">
      <h3>Account Settings</h3>
      <div class="account-head">
        <img id="accountAvatar" alt="" class="avatar-lg" />
        <div>
          <div id="accountAddr" class="account-addr"></div>
          <div class="muted">Active cookie session</div>
        </div>
      </div>
      <button id="btnLogout" class="sec">Sign Out</button>

      <hr class="sep" />
      <h4 class="danger-title">Danger Zone: Delete Mailbox</h4>
      <p class="muted">Permanently deletes your account, session cookies, and mailbox folders.</p>
      <div class="pw-wrap">
        <input id="delPass" type="password" placeholder="Confirm password to delete mailbox" />
        <button type="button" class="toggle-pw" data-target="delPass">Show</button>
      </div>
      <button id="btnDeleteAccount" class="danger">Delete My Mailbox Permanently</button>
      <div id="delStatus" class="status"></div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
